<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorePin CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
        }
        .hidden {
            display: none;
        }
        .nav-tabs {
            margin-bottom: 20px;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">LorePin CMS</h1>
        
        <!-- Authentication Section -->
        <div id="auth-section" class="mb-4">
            <div id="login-container">
                <h2>Login</h2>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>
                <button id="login-btn" class="btn btn-primary">Login</button>
                <button id="register-btn" class="btn btn-secondary">Register</button>
            </div>
            
            <div id="user-container" class="hidden">
                <h2>Welcome <span id="user-name"></span></h2>
                <p>Email: <span id="user-email"></span></p>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </div>
        
        <!-- CMS Content (only visible when logged in) -->
        <div id="cms-content" class="hidden">
            <ul class="nav nav-tabs" id="cmsTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="health-tab" data-bs-toggle="tab" data-bs-target="#health" type="button" role="tab">Health Check</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="roles-tab" data-bs-toggle="tab" data-bs-target="#roles" type="button" role="tab">Roles</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab">Users</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="moderation-tab" data-bs-toggle="tab" data-bs-target="#moderation" type="button" role="tab">Moderation</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="challenges-tab" data-bs-toggle="tab" data-bs-target="#challenges" type="button" role="tab">Challenges</button>
                </li>
            </ul>
            
            <div class="tab-content" id="cmsTabContent">
                <!-- Health Check Tab -->
                <div class="tab-pane fade show active" id="health" role="tabpanel">
                    <h3>Health Check</h3>
                    <button id="check-health-btn" class="btn btn-primary mb-3">Check Health</button>
                    <div id="health-result"></div>
                </div>
                
                <!-- Roles Tab -->
                <div class="tab-pane fade" id="roles" role="tabpanel">
                    <h3>Roles Management</h3>
                    <button id="get-roles-btn" class="btn btn-primary mb-3">Get Roles</button>
                    <div id="roles-result"></div>
                </div>
                
                <!-- Users Tab -->
                <div class="tab-pane fade" id="users" role="tabpanel">
                    <h3>User Management</h3>
                    <button id="get-users-btn" class="btn btn-primary mb-3">Get Users</button>
                    <div id="users-result"></div>
                </div>
                
                <!-- Moderation Tab -->
                <div class="tab-pane fade" id="moderation" role="tabpanel">
                    <h3>Moderation Queue</h3>
                    <button id="get-queue-btn" class="btn btn-primary mb-3">Get Queue</button>
                    <div id="moderation-result"></div>
                </div>
                
                <!-- Challenges Tab -->
                <div class="tab-pane fade" id="challenges" role="tabpanel">
                    <h3>Challenge Management</h3>
                    <button id="get-challenges-btn" class="btn btn-primary mb-3">Get Challenges</button>
                    <div id="challenges-result"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
